<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

#screen{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    pointer-events:none;
}

/* =========================
   LION
========================= */

#lion{
    position:absolute;

    left:20px;
    top:70%;

    width:250px;
    height:220px;

    z-index:999999;

    transform:translateY(-50%);

    opacity:0;

    pointer-events:none;
}

#lion.visible{
    opacity:1;
}

/* =========================
   WALKING
========================= */

#lion.walking{
    animation:lionBounce .36s infinite alternate;
}

@keyframes lionBounce{

    from{
        transform:
            translateY(-50%)
            rotate(-1deg);
    }

    to{
        transform:
            translateY(calc(-50% - 6px))
            rotate(1deg);
    }
}

/* =========================
   LEGS
========================= */

.leg{
    transform-box:fill-box;
    transform-origin:top center;
}

#lion.walking .legA{
    animation:walkA .36s infinite alternate;
}

#lion.walking .legB{
    animation:walkB .36s infinite alternate;
}

@keyframes walkA{

    from{
        transform:rotate(12deg);
    }

    to{
        transform:rotate(-12deg);
    }
}

@keyframes walkB{

    from{
        transform:rotate(-12deg);
    }

    to{
        transform:rotate(12deg);
    }
}

/* =========================
   TAIL
========================= */

.tail{
    transform-origin:170px 112px;
}

#lion.walking .tail{
    animation:tailWag .45s infinite alternate;
}

@keyframes tailWag{

    from{
        transform:rotate(-8deg);
    }

    to{
        transform:rotate(12deg);
    }
}

/* =========================
   HIT
========================= */

#lion.hit{
    animation:hitShake .12s infinite alternate;
}

@keyframes hitShake{

    from{
        transform:
            translateY(-50%)
            rotate(-8deg)
            scale(1);
    }

    to{
        transform:
            translateY(-50%)
            rotate(8deg)
            scale(1.12);
    }
}

/* =========================
   EXPLOSION
========================= */

#boom{

    position:absolute;

    display:none;

    font-size:90px;

    z-index:1000000;

    transform:
        translate(-50%,-50%);
}

#boom.show{

    display:block;

    animation:explosion .5s ease-out;
}

@keyframes explosion{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    40%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.5);
    }

    100%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

/* =========================
   STATUS
========================= */

#status{

    position:absolute;

    left:25px;
    top:25px;

    padding:8px 14px;

    border-radius:12px;

    background:rgba(0,0,0,.65);

    color:white;

    font-family:Arial,sans-serif;

    font-size:13px;

    opacity:.7;

    z-index:1000001;
}

</style>

<script>

const { ipcRenderer } = require("electron");

const lion =
    document.getElementById("lion");

const boom =
    document.getElementById("boom");

const status =
    document.getElementById("status");


/* =========================
   RESET
========================= */

function resetLion(){

    lion.classList.remove("walking");
    lion.classList.remove("hit");
    lion.classList.remove("visible");

    boom.classList.remove("show");

    lion.style.transition = "none";

    lion.style.left = "20px";

    lion.style.top = "70%";

    lion.style.opacity = "0";

    void lion.offsetWidth;

    lion.style.transition =
        "left 3s linear, top .25s ease, opacity .25s ease";

    status.textContent =
        "🦁 Focus: waiting...";
}


/* =========================
   TIMER
========================= */

ipcRenderer.on(
    "timer-update",
    (event,data)=>{

        const seconds =
            Number(data.seconds) || 0;

        const process =
            data.process || "App";

        status.textContent =
            `🦁 ${process} — ${seconds}/1800 sec`;
    }
);


/* =========================
   ATTACK
========================= */

ipcRenderer.on(
    "attack",
    (event,data)=>{

        const targetLeft =
            Number(data.left) || 0;

        const targetRight =
            Number(data.right) || 0;

        const targetTop =
            Number(data.top) || 0;

        const targetBottom =
            Number(data.bottom) || 0;


        const targetX =
            targetLeft +
            ((targetRight-targetLeft)*0.35);

        const targetY =
            targetTop +
            ((targetBottom-targetTop)*0.70);


        /* Reset starting position */

        lion.classList.remove("walking");
        lion.classList.remove("hit");

        lion.style.transition =
            "none";

        lion.style.left =
            "20px";

        lion.style.top =
            `${targetY}px`;


        /*
         * IMPORTANT FIX
         *
         * Make lion visible immediately
         * when attack event arrives.
         */

        lion.style.opacity =
            "1";

        lion.classList.add("visible");


        /*
         * Small delay so the browser
         * renders the lion first.
         */

        setTimeout(()=>{

            lion.classList.add("walking");

            lion.style.transition =
                "left 3s linear";

            lion.style.left =
                `${Math.max(
                    20,
                    targetX - 100
                )}px`;

        },150);


        /*
         * HIT
         */

        setTimeout(()=>{

            lion.classList.remove("walking");

            lion.classList.add("hit");

            boom.style.left =
                `${targetX}px`;

            boom.style.top =
                `${targetY}px`;

            boom.classList.add("show");

            status.textContent =
                "🦁💥 HIT! Closing app...";

        },3200);


        /*
         * DISAPPEAR
         */

        setTimeout(()=>{

            lion.classList.remove("hit");

            lion.classList.remove("walking");

            lion.style.transition =
                "opacity .45s ease";

            lion.style.opacity =
                "0";

        },4000);

    }
);


/* =========================
   RESET EVENT
========================= */

ipcRenderer.on(
    "reset-lion",
    ()=>{
        resetLion();
    }
);


/* =========================
   START HIDDEN
========================= */

resetLion();

</script>
